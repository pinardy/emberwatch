name: CI

# Automatic runs on pull requests and pushes to main are disabled.
# To re-enable, restore the `pull_request` and `push: branches: [main]` triggers.
on:
  # Run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR cancels its superseded run; every push to main is checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and UI tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      # The balance harness and the Playwright smoke test are not run here:
      # they made the pipeline slow. Run them locally with
      # `npm run test:balance` and `npm run test:e2e`.
